<linearGradient id="sh" x2="0" y2="1"><stop offset="0" stop-color="#9A5CF0"/><stop offset="1" stop-color="#6A2DB8"/></linearGradient></defs>
<rect width="512" height="512" fill="url(#sky)"/>

