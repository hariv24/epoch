<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Washington Square icon: "Promotion".
     Dusk in the park, the chess tables at the south-west corner. One of the old park lamps throws a pawn's shadow,
     and the shadow is a queen: in chess a pawn that walks the whole board gets promoted. The underdog, in one picture.
     NYU-violet dusk, warm Village stone, a checkerboard plaza. No logo, torch, letters, animals or faces.
     Maskable: pawn, queen and lamp sit inside the central r=205 circle. -->
