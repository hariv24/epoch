<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Tokyo Night icon (maskable, full bleed; key shapes inside the r=205 safe circle): "Bini-gasa". A clear convenience-store vinyl umbrella sheltering your one lit tower
     in the Tokyo rain. The windows are lit in Tokyo Night syntax colours. No text, no characters. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3052"/><stop offset=".55" stop-color="#1A1B26"/><stop offset="1" stop-color="#121219"/></linearGradient>
<radialGradient id="lamp" cx=".5" cy=".66" r=".42"><stop offset="0" stop-color="#FF9E64" stop-opacity=".38"/><stop offset="1" stop-color="#FF9E64" stop-opacity="0"/></radialGradient>
<linearGradient id="vinyl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C0CAF5" stop-opacity=".34"/><stop offset="1" stop-color="#C0CAF5" stop-opacity=".12"/></linearGradient>
<linearGradient id="tw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A68BE"/><stop offset="1" stop-color="#3D59A1"/></linearGradient>
<mask id="dry"><rect width="512" height="512" fill="#fff"/><path d="M84 250 L428 250 L440 512 L72 512Z" fill="#000" transform="rotate(-10 256 250)"/></mask>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
